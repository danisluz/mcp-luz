      - paragraph [ref=f1e38]: "“Não tenho tempo” é a frase mais repetida da nossa geração — e também a mais cara. Ela custa oração, custa família, custa chamado. Neste livro, o Pr. Geziel Pradier trata o tempo como aquilo que ele realmente é: uma mordomia diante de Deus."
